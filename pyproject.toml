[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "territory-circles"
version = "0.1.0"
description = "Circular sales territories from public data (Census Reporter + OpenStreetMap) with distance-based locking"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
territory-circles = "territory_circles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
